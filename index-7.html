<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17120e">
<title>Yahya.Hk</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{min-height:100%;}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(218,158,91,.18),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(62,129,151,.10),transparent 28%),
        #17120e;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.025) 50%,transparent 80%);
}

.page{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:18px 15px 35px;
}

.profile{
    position:relative;
    height:480px;
    overflow:hidden;
    border-radius:28px;
    background:#2a2119;
    box-shadow:0 25px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);
}

.profile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,
        rgba(0,0,0,.02) 15%,
        rgba(0,0,0,.08) 42%,
        rgba(0,0,0,.92) 100%);
}

.status{
    position:absolute;
    top:17px;
    right:17px;
    z-index:2;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(20,20,20,.48);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    font-size:11px;
}

.profile-info{
    position:absolute;
    z-index:2;
    left:20px;
    right:20px;
    bottom:25px;
    text-align:center;
}

.name{
    direction:ltr;
    font-size:42px;
    font-weight:800;
    letter-spacing:-1px;
    text-shadow:0 4px 25px rgba(0,0,0,.9);
}

.tagline{
    margin-top:6px;
    color:#e9e3dc;
    font-size:12px;
}

.bio{
    margin:22px 7px 24px;
    text-align:center;
    color:#d6cec5;
    font-size:13px;
    line-height:2;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.link{
    position:relative;
    min-height:86px;
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 16px;
    text-decoration:none;
    color:#fff;
    border-radius:21px;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 35px rgba(0,0,0,.28);
    backdrop-filter:blur(18px);
    overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}

.link::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:-80px;
    top:-70px;
    border-radius:50%;
    background:rgba(220,165,96,.13);
    filter:blur(22px);
}

.link:hover{
    transform:translateY(-4px);
    border-color:rgba(226,174,106,.4);
    box-shadow:0 20px 45px rgba(0,0,0,.38);
}

.icon{
    position:relative;
    z-index:1;
    width:49px;
    height:49px;
    flex:0 0 49px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    font-size:21px;
}

.text{
    position:relative;
    z-index:1;
    flex:1;
    text-align:center;
}

.title{
    font-size:15px;
    font-weight:700;
}

.sub{
    margin-top:4px;
    color:#aaa29a;
    font-size:10px;
}

.arrow{
    position:relative;
    z-index:1;
    color:#aaa;
    font-size:20px;
}

.footer{
    text-align:center;
    margin-top:28px;
    color:#655e57;
    font-size:9px;
}

@media(max-width:480px){
    .page{padding:12px 12px 28px}
    .profile{height:445px;border-radius:24px}
    .name{font-size:37px}
    .bio{font-size:12px}
}
</style>

<style>
/* ===== تأثيرات تفاعلية إضافية ===== */
.theme-toggle{
    position:fixed;
    top:16px;
    left:16px;
    z-index:20;
    width:46px;
    height:46px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;
    background:rgba(20,18,15,.58);
    color:#fff;
    font-size:21px;
    cursor:pointer;
    backdrop-filter:blur(14px);
    box-shadow:0 0 22px rgba(255,180,80,.12);
    transition:.3s ease;
}
.theme-toggle:hover{
    transform:rotate(18deg) scale(1.08);
    box-shadow:0 0 30px rgba(255,190,100,.28);
}

/* خط ضوء متحرك حول الصورة */
.profile{
    isolation:isolate;
}
.profile::before{
    content:"";
    position:absolute;
    inset:-2px;
    z-index:3;
    border-radius:30px;
    padding:2px;
    background:linear-gradient(
        90deg,
        transparent 0%,
        transparent 28%,
        #48cfff 42%,
        #fff 50%,
        #ff9f4a 58%,
        transparent 72%,
        transparent 100%
    );
    background-size:250% 100%;
    animation:borderRun 4.5s linear infinite;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    opacity:.9;
}
@keyframes borderRun{
    from{background-position:200% 0}
    to{background-position:-50% 0}
}

/* نبضة ضوء خفيفة على الصورة */
.profile img{
    animation:imageBreath 7s ease-in-out infinite;
}
@keyframes imageBreath{
    0%,100%{filter:saturate(.9) contrast(1.05) brightness(1)}
    50%{filter:saturate(1.03) contrast(1.06) brightness(1.045)}
}

/* وهج متحرك داخل الخانات */
.link{
    isolation:isolate;
}
.link::after{
    content:"";
    position:absolute;
    top:-100%;
    left:-35%;
    width:22%;
    height:300%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.16),
        transparent
    );
    transform:rotate(18deg);
    animation:shine 5.5s ease-in-out infinite;
    pointer-events:none;
}
.link:nth-child(2)::after{
    animation-delay:1.5s;
}
@keyframes shine{
    0%,35%{left:-40%;opacity:0}
    45%{opacity:1}
    65%,100%{left:125%;opacity:0}
}

/* نقاط ضوء صغيرة */
.page::before,
.page::after{
    content:"";
    position:fixed;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#5fdcff;
    box-shadow:0 0 14px 4px rgba(95,220,255,.35);
    pointer-events:none;
    z-index:1;
    animation:floatDot 6s ease-in-out infinite;
}
.page::before{top:26%;right:8%}
.page::after{
    top:70%;
    left:8%;
    animation-delay:2.7s;
    background:#ffad63;
    box-shadow:0 0 14px 4px rgba(255,173,99,.3);
}
@keyframes floatDot{
    0%,100%{transform:translate(0,0);opacity:.25}
    50%{transform:translate(12px,-25px);opacity:.8}
}

/* وضع الإضاءة */
body.light{
    background:
      radial-gradient(circle at 15% 10%,rgba(255,194,110,.22),transparent 30%),
      radial-gradient(circle at 90% 80%,rgba(80,170,210,.13),transparent 30%),
      #e8d5bc;
    color:#211a15;
}
body.light .theme-toggle{
    background:rgba(255,255,255,.68);
    color:#33261c;
    border-color:rgba(70,50,30,.14);
}
body.light .bio{color:#4b4037}
body.light .link{
    background:linear-gradient(135deg,rgba(255,255,255,.58),rgba(255,255,255,.28));
    border-color:rgba(80,55,30,.12);
    color:#2b2119;
}
body.light .link-sub{color:#75695e}
body.light .icon{background:rgba(70,50,30,.07);border-color:rgba(70,50,30,.08)}
body.light .arrow{color:#75695e}
body.light .copyright{color:#806f60}
body.light .profile{
    box-shadow:0 25px 70px rgba(80,55,30,.22),0 0 0 1px rgba(70,50,30,.08);
}

/* حركة بسيطة عند دخول الصفحة */
.profile,.bio,.link{
    animation:rise .75s ease both;
}
.bio{animation-delay:.12s}
.link:nth-child(1){animation-delay:.22s}
.link:nth-child(2){animation-delay:.34s}
@keyframes rise{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
}
</style>


<style>
/* إطار الصورة — واضح ومضيء */
.profile{
    border:2px solid rgba(255,190,105,.85) !important;
    box-shadow:
        0 0 0 1px rgba(75,210,255,.35),
        0 0 22px rgba(255,174,82,.32),
        0 25px 70px rgba(0,0,0,.48) !important;
}
.profile::before{
    inset:-3px !important;
    border-radius:31px !important;
    padding:3px !important;
    background:linear-gradient(
        90deg,
        #ff9d42,
        #ffe2a8,
        #45d7ff,
        #ffffff,
        #ff9d42
    ) !important;
    background-size:300% 100% !important;
    animation:borderRun 3.2s linear infinite !important;
    opacity:1 !important;
}
@keyframes borderRun{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* أزرار الموقع: توهج واضح من الأسفل */
.link{
    box-shadow:
        0 8px 0 rgba(0,0,0,.12),
        0 15px 28px rgba(0,0,0,.30),
        0 4px 20px rgba(255,171,87,.12);
}
.link::before{
    width:80%;
    height:45%;
    right:10%;
    top:auto;
    bottom:-34px;
    border-radius:50%;
    background:rgba(255,157,66,.55);
    filter:blur(24px);
    opacity:.55;
    transition:.35s ease;
}
.link:hover::before,
.link:active::before{
    opacity:1;
    bottom:-22px;
}
.link:hover{
    box-shadow:
        0 8px 0 rgba(0,0,0,.12),
        0 20px 38px rgba(0,0,0,.36),
        0 0 28px rgba(255,171,87,.28);
}

/* الفقاعات */
.touch-bubble{
    position:fixed;
    z-index:9999;
    width:12px;
    height:12px;
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.2);
    animation:bubblePop .85s cubic-bezier(.2,.8,.25,1) forwards;
    box-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 42px currentColor;
}
.touch-bubble::after{
    content:"";
    position:absolute;
    inset:-10px;
    border:2px solid currentColor;
    border-radius:50%;
    opacity:.7;
    animation:bubbleRing .85s ease-out forwards;
}
@keyframes bubblePop{
    0%{transform:translate(-50%,-50%) scale(.15);opacity:1}
    45%{transform:translate(-50%,-50%) scale(1.25);opacity:.95}
    100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}
}
@keyframes bubbleRing{
    0%{transform:scale(.3);opacity:.8}
    100%{transform:scale(2.2);opacity:0}
}

/* لمسة أجمل للوضع الفاتح */
body.light .profile{
    box-shadow:
        0 0 0 1px rgba(70,150,180,.28),
        0 0 25px rgba(220,145,65,.25),
        0 25px 65px rgba(80,55,30,.22) !important;
}
</style>

</head>

<script>
/* فقاعات ضوئية ملوّنة مع كل لمسة أو نقرة */
const bubbleColors = [
    "#4ddcff",
    "#ff9f43",
    "#ff4f9a",
    "#a66cff",
    "#58e68a",
    "#ffe05b",
    "#ff635f"
];

let bubbleIndex = 0;

function createBubble(x, y) {
    const bubble = document.createElement("span");
    bubble.className = "touch-bubble";
    bubble.style.left = x + "px";
    bubble.style.top = y + "px";

    const color = bubbleColors[bubbleIndex % bubbleColors.length];
    bubbleIndex++;

    bubble.style.color = color;
    bubble.style.background = color;

    document.body.appendChild(bubble);

    setTimeout(() => bubble.remove(), 900);
}

/* يعمل على الهاتف والكمبيوتر */
document.addEventListener("pointerdown", (e) => {
    createBubble(e.clientX, e.clientY);
}, {passive:true});
</script>
